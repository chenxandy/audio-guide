};
function detect(){
  var saved=null;
  try{saved=localStorage.getItem("ystLang")}catch(e){}
  if(saved&&D.shows[saved])return saved;
  var list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"];
  for(var i=0;i<list.length;i++){
    var l=String(list[i]).toLowerCase().slice(0,2);
    if(l==="zh"||l==="en"||l==="ja"||l==="ko")return l;
  }
  return "en";
}
function url(lang,ep){
  var show=D.shows[lang];
  if(ep&&D.eps[lang][ep])return "https://player.soundon.fm/p/"+show+"/episodes/"+D.eps[lang][ep];
  return "https://player.soundon.fm/p/"+show;
}
var q=new URLSearchParams(location.search);
var ep=q.get("ep");
if(!(ep&&D.eps.zh[ep]))ep=null;
var lang=detect();
var t=T[lang];
document.documentElement.lang={zh:"zh-Hant",en:"en",ja:"ja",ko:"ko"}[lang];
document.getElementById("msg").textContent=ep?t.go:t.pick;
document.getElementById("ep").textContent=ep?t.ep.replace("{n}",ep):"";
document.getElementById("hint").textContent=ep?t.hint:"";
var nav=document.getElementById("langs");
LANGS.forEach(function(p){
  var a=document.createElement("a");
  a.href=url(p[0],ep);a.textContent=p[1];
  if(ep&&p[0]===lang)a.className="on";
  a.addEventListener("click",function(){try{localStorage.setItem("ystLang",p[0])}catch(e){}});
  nav.appendChild(a);
});
